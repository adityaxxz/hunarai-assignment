[project]
name = "hunar-fde-backend"
version = "0.1.0"
description = "Backend for the Hunar.AI FDE take-home: hiring assistant + sourcing reachout"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
# Every test in this project is async; asking for a marker on each one is noise.
asyncio_mode = "auto"
testpaths = ["tests"]
